apiVersion: apps/v1
kind: Deployment
metadata:
  name: masea-frontend
  namespace: masea
  labels:
    app.kubernetes.io/name: masea-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: masea-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masea-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/spatel842002/masea-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: masea-frontend
  namespace: masea
spec:
  selector:
    app.kubernetes.io/name: masea-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
