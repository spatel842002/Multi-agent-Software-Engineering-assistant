apiVersion: apps/v1
kind: Deployment
metadata:
  name: masea-worker
  namespace: masea
  labels:
    app.kubernetes.io/name: masea-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: masea-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masea-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/spatel842002/masea-backend:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: masea-backend-config
            - secretRef:
                name: masea-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["celery", "-A", "app.workers.celery_app", "inspect", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
