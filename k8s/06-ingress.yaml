# Assumes an nginx-ingress-controller (or compatible) is already installed
# in the cluster, and a ClusterIssuer named `letsencrypt-prod` exists if
# using cert-manager for TLS -- neither is provisioned by these manifests.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masea
  namespace: masea
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - masea.example.com
      secretName: masea-tls
  rules:
    - host: masea.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: masea-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: masea-frontend
                port:
                  number: 80
