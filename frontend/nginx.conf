server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The three chat workflows run CPU-bound local LLM inference and can
        # legitimately take well over a minute (observed: 40-95s against a
        # real qwen2.5-coder:1.5b model on this dev machine) -- nginx's
        # 60s default proxy_read_timeout returned a bare "Gateway Time-out"
        # mid-request during real end-to-end testing before this was raised.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback: any non-file, non-/api route serves index.html so
    # client-side routing (react-router) handles the path.
    location / {
        try_files $uri /index.html;
    }
}
