[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must load .env.test before importing `app.*`, which reads env vars at import time.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "slowapi.*", "langchain_ollama.*", "argon2.*", "mlflow.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Without this, `pytest` invoked directly (not `python -m pytest`) doesn't
# add the backend root to sys.path, and `import app.models` in conftest.py
# fails with "No module named 'app'" -- this is exactly what CI's plain
# `pytest ...` step hit (found by reproducing it locally, not by guessing).
pythonpath = ["."]
markers = [
    "integration: requires a real external dependency (Postgres/Redis/Qdrant/Ollama/Docker)",
    "model_download: downloads a real model on first run",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 70
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
